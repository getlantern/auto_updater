  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"
      - uses: bluefireteam/melos-action@v3
      - working-directory: ./packages/auto_updater/example
        run: |
          flutter build macos --release
      - run: |
          packages/auto_updater_macos/macos/Tests/run_tests.sh packages/auto_updater/example/macos/Pods/Sparkle
      - run: |
          python3 -m venv "$RUNNER_TEMP/delivery-venv"
          "$RUNNER_TEMP/delivery-venv/bin/pip" install 'cryptography>=44,<47'
          "$RUNNER_TEMP/delivery-venv/bin/python" tests/native_delivery/run.py --sparkle packages/auto_updater/example/macos/Pods/Sparkle

  # build-web:
  #   runs-on: macos-latest
